          - heading "Debates on Cost-Effectiveness and Over-Reliance on Planning Copy link to section Listen to this section" [level=3] [ref=e749]:
            - text: Debates on Cost-Effectiveness and Over-Reliance on Planning
            - generic [ref=e750]:
              - button "Copy link to section" [ref=e751] [cursor=pointer]:
                - img [ref=e752]
              - button "Listen to this section" [ref=e755] [cursor=pointer]:
                - img [ref=e756]
          - generic [ref=e759]:
            - text: Critics have argued that WOHA's emphasis on extensive greenery integration and
            - link "passive ventilation" [ref=e760] [cursor=pointer]:
              - /url: /page/Passive_ventilation
            - text: systems in high-density towers incurs substantial upfront construction costs, potentially undermining cost-effectiveness in market-driven contexts without public subsidies. For instance, projects like Oasia Downtown (completed 2016) feature dense vegetative facades requiring specialized planters and structural reinforcements, which, while low-maintenance per WOHA's low-tech approach, demand higher initial investments compared to conventional high-rises.
            - superscript [ref=e761] [cursor=pointer]:
              - link:
                - /url: "#ref-77"
                - superscript
              - link "[77]" [ref=e762]:
                - /url: "#ref-77"
            - text: In luxury developments such as
            - link "Trump Tower" [ref=e763] [cursor=pointer]:
              - /url: /page/Trump_Tower
            - link "Mumbai" [ref=e764] [cursor=pointer]:
              - /url: /page/Mumbai
            - text: (proposed adaptations),
            - link "sustainability" [ref=e765] [cursor=pointer]:
              - /url: /page/Sustainability
            - text: features like natural ventilation were compromised for air-conditioning to meet client demands, highlighting how economic pressures can erode the model's purported long-term savings on energy.
            - superscript [ref=e766] [cursor=pointer]:
              - link:
                - /url: "#ref-72"
                - superscript
              - link "[72]" [ref=e767]:
                - /url: "#ref-72"
          - generic [ref=e768]:
            - text: Debates on over-reliance on planning center on WOHA's model's dependence on Singapore's centralized urban framework, including the Urban Redevelopment Authority's (URA) mandates for
            - link "density" [ref=e769] [cursor=pointer]:
              - /url: /page/Density
            - text: and
            - link "landscaping" [ref=e770] [cursor=pointer]:
              - /url: /page/Landscaping
            - text: ", which facilitate public housing prototypes like SkyVille@Dawson (2015) with integrated sky villages. Outside this system, as in The Met ("
            - link "Bangkok" [ref=e771] [cursor=pointer]:
              - /url: /page/Bangkok
            - text: ", 2009), fragmented"
            - link "land use" [ref=e772] [cursor=pointer]:
              - /url: /page/Land_use
            - text: and traffic isolation render communal terraces less viable, necessitating vehicular access that contradicts the design's walkable intent.
            - superscript [ref=e773] [cursor=pointer]:
              - link:
                - /url: "#ref-72"
                - superscript
              - link "[72]" [ref=e774]:
                - /url: "#ref-72"
            - text: Analysts contend this ties WOHA's successes to Singapore's communitarian
            - link "governance" [ref=e775] [cursor=pointer]:
              - /url: /page/Governance
            - text: and coordinated infrastructure, limiting scalability to less regulated environments where private developers prioritize profit over holistic
            - link "urbanism" [ref=e776] [cursor=pointer]:
              - /url: /page/Urbanism
            - text: .
            - superscript [ref=e777] [cursor=pointer]:
              - link:
                - /url: "#ref-72"
                - superscript
              - link "[72]" [ref=e778]:
                - /url: "#ref-72"
          - generic [ref=e779]:
            - text: Proponents counter that empirical performance in
            - link "Singapore" [ref=e780] [cursor=pointer]:
              - /url: /page/Singapore
            - text: ", such as reduced energy use in HDB blocks via"
            - link "monsoon" [ref=e781] [cursor=pointer]:
              - /url: /page/Monsoon
            - text: windows, demonstrates viability when
            - link "planning" [ref=e782] [cursor=pointer]:
              - /url: /page/Planning
            - text: aligns incentives, but acknowledge adaptations abroad often dilute core principles due to site-specific constraints.
            - superscript [ref=e783] [cursor=pointer]:
              - link:
                - /url: "#ref-72"
                - superscript
              - link "[72]" [ref=e784]:
                - /url: "#ref-72"
            - text: These debates underscore a tension between innovative tropical
            - link "urbanism" [ref=e785] [cursor=pointer]:
              - /url: /page/Urbanism
            - text: and pragmatic economics, with WOHA's approach excelling under state-orchestrated density but facing hurdles in decentralized markets.
