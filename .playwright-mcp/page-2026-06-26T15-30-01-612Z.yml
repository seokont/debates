                - /url: "#ref-74"
            - text: These constraints suggest WOHA's "vertical village" paradigm, while innovative for resource-scarce tropics under authoritarian coordination, resists universalization without equivalent institutional preconditions.
            - superscript [ref=e717] [cursor=pointer]:
              - link:
                - /url: "#ref-72"
                - superscript
              - link "[72]" [ref=e718]:
                - /url: "#ref-72"
          - heading "Specific Project Disputes Copy link to section Listen to this section" [level=3] [ref=e719]:
            - text: Specific Project Disputes
            - generic [ref=e720]:
              - button "Copy link to section" [ref=e721] [cursor=pointer]:
                - img [ref=e722]
              - button "Listen to this section" [ref=e725] [cursor=pointer]:
                - img [ref=e726]
          - generic [ref=e729]:
            - text: As noted by critic
            - link "Nikil Saval" [ref=e730] [cursor=pointer]:
              - /url: /page/Nikil_Saval
            - text: in a 2016 analysis, WOHA's The Met condominium tower in
            - link "Bangkok" [ref=e731] [cursor=pointer]:
              - /url: /page/Bangkok
            - text: ", completed in 2009, exemplifies tensions between architectural innovation and site-specific urban challenges. The 66-story structure incorporates natural cross-ventilation and creeper-shaded facades to adapt low-rise tropical housing principles to high-density living, yet its positioning overlooks the eight-lane Sathorn Road, which Saval contends effectively isolates residents and compels reliance on vehicles for short trips, such as reaching a nearby cinema."
            - superscript [ref=e732] [cursor=pointer]:
              - link:
                - /url: "#ref-72"
                - superscript
              - link "[72]" [ref=e733]:
                - /url: "#ref-72"
            - superscript [ref=e734] [cursor=pointer]:
              - link:
                - /url: "#ref-14"
                - superscript
              - link "[14]" [ref=e735]:
                - /url: "#ref-14"
          - generic [ref=e736]:
            - text: Similarly, for Trump Tower Mumbai—WOHA's contribution to the Lodha Park development, a 78-story residential skyscraper completed in 2021—the firm's initial scheme featured a naturally ventilated lobby suited to Mumbai's climate, but this was overridden by the Trump Organization's mandate for air-conditioning.
            - superscript [ref=e737] [cursor=pointer]:
              - link:
                - /url: "#ref-72"
                - superscript
              - link "[72]" [ref=e738]:
                - /url: "#ref-72"
            - superscript [ref=e739] [cursor=pointer]:
              - link:
                - /url: "#ref-75"
                - superscript
              - link "[75]" [ref=e740]:
                - /url: "#ref-75"
            - text: Saval highlighted the inclusion of roughly 1,200 parking spaces for about 300 units as exacerbating car dependency in a site originally envisioned under urban planner Charles Correa's 1990s framework for mixed public amenities, shifting toward privatized luxury.
            - superscript [ref=e741] [cursor=pointer]:
              - link:
                - /url: "#ref-72"
                - superscript
              - link "[72]" [ref=e742]:
                - /url: "#ref-72"
            - superscript [ref=e743] [cursor=pointer]:
              - link:
                - /url: "#ref-76"
                - superscript
              - link "[76]" [ref=e744]:
                - /url: "#ref-76"
          - generic [ref=e745]:
            - text: These instances reflect broader debates on balancing client-driven modifications and infrastructural realities against WOHA's prototypical emphasis on ventilation and greenery, though no formal legal challenges or
            - link "community" [ref=e746] [cursor=pointer]:
              - /url: /page/Community
            - text: protests have been documented for either project.
            - superscript [ref=e747] [cursor=pointer]:
              - link:
                - /url: "#ref-72"
